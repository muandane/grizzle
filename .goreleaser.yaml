version: 2

project_name: grizzle

before:
  hooks:
    - go mod tidy

builds:
  - id: grizzle
    main: ./cmd/grizzle
    binary: grizzle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

# Semver prerelease tags (rc / beta / alpha) publish as GitHub prereleases so
# the Update Changelog workflow (`on: release: types: [released]`) does not run.
release:
  prerelease: auto
  mode: replace

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
