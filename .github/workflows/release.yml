name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run Quality Suite (lint + vet + unit + integration)
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/grizzle_test?sslmode=disable
          POSTGRES_DSN: postgres://postgres:password@localhost:5432/grizzle_test?sslmode=disable
        run: |
          golangci-lint run ./...
          (cd otelgrizzle && golangci-lint run ./...)
          go vet ./...
          (cd otelgrizzle && go vet ./...)
          go test -race -count=1 ./...
          (cd otelgrizzle && go test -race -count=1 ./...)
          out=$(go test -tags integration -race -count=1 -v ./...)
          echo "$out"
          pass_count=$(echo "$out" | grep -c "^--- PASS" || true)
          echo "Executed passing integration tests: $pass_count"
          if [ "$pass_count" -eq 0 ]; then
            echo "Error: No integration tests were executed!"
            exit 1
          fi

  goreleaser:
    name: Build & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-goproxy:
    name: Publish to pkg.go.dev (Go Proxy)
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Index on pkg.go.dev
        # proxy.golang.org can only fetch PUBLIC modules; while the repository
        # is private this ping 404s by design. continue-on-error keeps the
        # release green and the ping turns into a working notification once
        # the repository goes public.
        continue-on-error: true
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Pinging proxy.golang.org for github.com/muandane/grizzle@${VERSION}..."
          GOPROXY=https://proxy.golang.org go list -m "github.com/muandane/grizzle@${VERSION}"
