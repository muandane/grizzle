name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint (root module)
        run: golangci-lint run ./...

      - name: Run golangci-lint (otelgrizzle module)
        run: |
          cd otelgrizzle
          golangci-lint run ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          (cd otelgrizzle && go mod verify)

      - name: Go Vet
        run: |
          go vet ./...
          (cd otelgrizzle && go vet ./...)

      - name: Run Unit Tests with Race Detector
        run: |
          go test -race -count=1 ./...
          (cd otelgrizzle && go test -race -count=1 ./...)

  integration:
    name: Integration Tests (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # On PRs, test against PostgreSQL 16 to save runner minutes.
        # On pushes to main, test the full matrix [14, 15, 16, 17, 18].
        postgres-version: ${{ github.event_name == 'pull_request' && fromJSON('["16"]') || fromJSON('["14", "15", "16", "17", "18"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: grizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/grizzle_test?sslmode=disable
          POSTGRES_DSN: postgres://postgres:password@localhost:5432/grizzle_test?sslmode=disable
        run: |
          echo "Running integration tests against PostgreSQL ${{ matrix.postgres-version }}..."
          set -o pipefail
          go test -tags integration -race -count=1 -v ./... | tee test.log
          pass_count=$(grep -c "^--- PASS" test.log || true)
          echo "Executed passing integration tests: $pass_count"
          if [ "$pass_count" -eq 0 ]; then
            echo "Error: No integration tests were executed! Count is 0."
            exit 1
          fi
